name: Bug report
description: wheelgap gave a wrong result, crashed, or misread a file.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The `--explain` output below is usually all we need to reproduce a wrong result, so you don't need to share your lockfile.
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: wheelgap uv.lock -p 3.13 -t musl-aarch64
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output with --explain
      description: Run the same command with `--explain` added and paste the output. For a crash, paste the full error.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: For example, "numpy 2.3.4 has a musllinux_1_2_aarch64 wheel on PyPI, so it should be ✓".
    validations:
      required: true
  - type: textarea
    id: pip
    attributes:
      label: What pip says (optional, but it settles it)
      description: |
        The same package and target checked with pip, e.g. `pip download --no-deps --only-binary=:all: --index-url https://pypi.org/simple -d /tmp/wg-check --platform musllinux_1_2_aarch64 --platform musllinux_1_1_aarch64 --python-version 3.14 --implementation cp --abi cp314t numpy==2.3.4`. Paste the command and its output. [AGENTS.md](https://github.com/wheelgap/wheelgap/blob/main/AGENTS.md#no-issue-fits-find-a-real-bug) has the full list of `--platform` tags to pass for each target.
      render: text
  - type: textarea
    id: found-by
    attributes:
      label: How did you find it?
      description: For example "my Docker build failed", or "checking a real lockfile with Claude Code, following AGENTS.md".
  - type: input
    id: version
    attributes:
      label: wheelgap version
      description: Output of `wheelgap --version`.
      placeholder: "wheelgap 0.9.0 (packaging 26.3, CPython 3.13.1)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python you ran it on
      placeholder: macOS 15, Python 3.13
